name: Atualizar Code.gs no Apps Script (uso unico)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar Code.gs via script python
        run: python3 scripts/enviar_atualizacao.py > /tmp/resultado.txt 2>/tmp/resultado_stderr.txt; cat /tmp/resultado_stderr.txt; cat /tmp/resultado.txt
      - name: Salvar resultado via API do GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          cat /tmp/resultado_stderr.txt /tmp/resultado.txt > /tmp/final.txt
          B64=$(base64 -w0 /tmp/final.txt)
          SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/contents/resultado_atualizacao.json" | jq -r '.sha // empty')
          if [ -n "$SHA" ]; then
            curl -s -X PUT -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/contents/resultado_atualizacao.json" \
              -d "{\"message\":\"resultado atualizacao\",\"content\":\"$B64\",\"sha\":\"$SHA\",\"branch\":\"main\"}" \
              -o /dev/null -w "PUT status: %{http_code}\n"
          else
            curl -s -X PUT -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/contents/resultado_atualizacao.json" \
              -d "{\"message\":\"resultado atualizacao\",\"content\":\"$B64\",\"branch\":\"main\"}" \
              -o /dev/null -w "PUT status: %{http_code}\n"
          fi
