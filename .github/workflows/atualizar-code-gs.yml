name: Atualizar Code.gs no Apps Script (uso unico)
on:
  workflow_dispatch:
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar Code.gs para o Apps Script e salvar resultado
        run: |
          set -e
          jq -n --arg action "atualizarCodigo" --rawfile codigo Code.gs --arg senha "TROQUE_ESTA_SENHA" \
            '{action:$action, novoCodigoGs:$codigo, senha:$senha}' > /tmp/payload.json
          RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://script.google.com/macros/s/AKfycbwaqTeyXPt9XHQB3ZFIvc8sLensJxxOt7ahLPFaOjNgFOzdJ_TT6-6KvW9s-xGst6fqzg/exec" \
            -H "Content-Type: text/plain;charset=utf-8" \
            --data @/tmp/payload.json)
          echo "$RESP"
          echo "$RESP" > resultado_atualizacao.json
      - name: Commitar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultado_atualizacao.json
          git commit -m "Resultado da chamada de auto-atualizacao" || echo "nada para commitar"
          git push
